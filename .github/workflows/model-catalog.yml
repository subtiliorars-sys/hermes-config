name: Model catalog audit
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '*.py'
      - 'routing.json'
      - 'tests/**'
      - '.github/workflows/model-catalog.yml'
permissions:
  contents: write
concurrency:
  group: model-catalog
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Fetch catalogs (72-hour gate on scheduled runs)
        id: audit
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ]; then
            python catalog.py --if-due
          else
            python catalog.py
          fi
      - name: Publish audit records
        if: always()
        run: |
          if [ -f reports/latest.md ]; then cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record model catalog audit [skip ci]'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      - name: Preserve run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-catalog-${{ github.run_id }}
          path: reports/
          retention-days: 90
          if-no-files-found: warn
